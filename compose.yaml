services:
  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/bizsage.db
      CHECKPOINT_DB_URL: sqlite+aiosqlite:////data/checkpoints.db
    volumes:
      - bizsage-data:/data
    expose:
      - "8000"
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    init: true
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  bizsage-data:
