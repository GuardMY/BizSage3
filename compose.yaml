services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/bizsage.db
      CHECKPOINT_DB_URL: sqlite+aiosqlite:////data/checkpoints.db
    volumes:
      - bizsage-data:/data
    expose:
      - "8000"
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    init: true
    restart: unless-stopped

volumes:
  bizsage-data:
